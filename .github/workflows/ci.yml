# Four jobs on every push and pull request (three in parallel):
#   - ci: what `mise run ci` runs locally (lint, the docs site check, all
#     test suites and the regress tests, against the pgrx-managed Postgres
#     18); on tags also the release tarball.
#   - docs: only the docs site check (`mise run docs-check`), for quick
#     feedback.
#   - docker: builds the Docker images (BuildKit, layers cached in the GitHub
#     Actions cache): the full image and the CloudNativePG extension image,
#     from one builder stage, and runs tests/docker.sh against them,
#     including the container variants of the multi-session suites and
#     tests/cnpg_smoke.sh. On tags it runs on an amd64 and a native arm64
#     runner and uploads each image as a workflow artifact.
#   - cnpg-e2e (after docker; on tags, the nightly schedule and manual
#     runs, or on every event with the repository variable
#     PG_AUTOMERGE_CNPG_E2E=always): tests/cnpg_e2e.sh, the CNPG extension
#     image with the real CloudNativePG operator in a kind cluster.
# On tags, publish pushes both images to a registry, but only once one is
# configured (docs/src/pages/operations/docker-ci.mdx, "Publishing the
# images"): ghcr.io with the workflow's own token (PG_AUTOMERGE_PUBLISH=ghcr),
# or any registry with a token secret; until then it skips.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly: also run the benchmarks.
    - cron: "17 3 * * *"
  workflow_dispatch:

# One group per event and ref: a newer push supersedes an older push run on
# the same ref, but a push to main never cancels the nightly (schedule) run
# with its benchmarks, nor the other way round.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # pgrx builds Postgres from source into ~/.pgrx.
  PGRX_HOME: /home/runner/.pgrx

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Postgres build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libreadline-dev zlib1g-dev flex bison libicu-dev \
            libclang-dev clang pkg-config libssl-dev libxml2-dev libxslt1-dev
          # The runner's own Postgres would take the default port; pgrx
          # uses 28818, but make sure nothing interferes.
          sudo systemctl stop postgresql || true

      # Rust (with rustfmt and clippy) and cargo-pgrx, as pinned in
      # mise.toml. mise.toml puts /usr/bin first on PATH (see its comment).
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Cache cargo registry, target and the pgrx Postgres
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.pgrx
          key: ${{ runner.os }}-pgrx0.19.3-pg18-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-pgrx0.19.3-pg18-

      - name: Initialize pgrx (builds Postgres 18 unless cached)
        run: |
          if [ ! -f "$PGRX_HOME/config.toml" ]; then mise run pgrx-init; fi

      - name: Lint, docs check, test, regress
        run: mise run ci

      - name: Benchmarks (nightly only)
        if: github.event_name == 'schedule'
        run: |
          mise run bench-core | tee bench-core.txt
          BENCH_REPS=2 mise run bench-expanded | tee bench-expanded.txt
          mise run bench-sql | tee bench-sql.txt

      - name: Upload benchmark tables
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: bench-*.txt

      # The package is built against the PGDG Postgres 18 (not pgrx's
      # development Postgres in ~/.pgrx): `cargo pgrx package` mirrors the
      # pg_config's install paths, so the tarball unpacks into
      # /usr/lib/postgresql/18/lib and /usr/share/postgresql/18/extension.
      - name: Install PGDG Postgres 18 (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Package (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config mise run package

      # Install the tarball the way docs/src/pages/guide/install.mdx says and create the
      # extension in the PGDG server.
      - name: Check the package installs (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo tar -C / -xzf target/release/pg_automerge-pg18.tar.gz
          sudo pg_ctlcluster 18 main start || sudo pg_createcluster 18 main --start
          sudo -u postgres psql -p "$(pg_conftool -s 18 main show port)" -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION pg_automerge' \
            -c "SELECT automerge_to_jsonb(''::bytea::automerge)"

      # Attached to the workflow run (Actions > run > Artifacts), not to a
      # GitHub release.
      - name: Upload package (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: pg_automerge-pg18
          path: target/release/pg_automerge-pg18.tar.gz

  # The documentation site (docs/): typecheck, biome, the static build
  # under /pg-automerge/ and the link/route check, as
  # `mise run docs-check` (also part of `mise run ci`). A job of its own so
  # docs feedback does not wait for pgrx; deploy-docs.yml publishes the
  # site from main.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node and pnpm as pinned in mise.toml; nothing else.
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
          cache: true

      # mise run would otherwise install every tool in mise.toml first
      # (Rust, building cargo-pgrx from source).
      - name: Docs check
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run docs-check

  # The Docker images of docker/Dockerfile: the full image (official
  # postgres:18 + the extension built against its PGDG Postgres) and the
  # CloudNativePG extension image (the same build's files, from scratch),
  # tested with tests/docker.sh.
  # Independent of the ci job: it needs neither pgrx nor its Postgres.
  docker:
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # amd64 always; on tags also arm64, on GitHub's native arm64 runner
        # (no QEMU, no cross-compilation; see
        # docs/src/pages/design/docker-image.mdx, "Docker image in CI"). Set
        # the repository variable PG_AUTOMERGE_ARM64=false
        # where that runner is not available.
        arch: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') && vars.PG_AUTOMERGE_ARM64 != 'false') && '["amd64", "arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the crate version (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sh scripts/versions.sh | sed -n 's/^CRATE_VERSION=//p')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml's version $version"
            exit 1
          fi

      # Rust as pinned in mise.toml, for the suites' fixture generators
      # (cargo run -p pg_automerge_core --example ...). Only Rust: the image
      # builds its own toolchain, and nothing here needs cargo-pgrx.
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
          cache: true

      # The client tools of the same major as the server (psql, pg_dump,
      # pg_restore, pg_regress, pg_config): PGDG's postgresql-client-18,
      # the package the image's own Postgres comes from. No server, no
      # cluster.
      - name: Install the PGDG Postgres 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/psql --version
          docker version --format 'docker {{.Server.Version}}'
          docker compose version

      # A docker-container builder (BuildKit), which can export its cache;
      # the runtime token lets `docker build` in a run step reach the
      # GitHub Actions cache (type=gha).
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - uses: crazy-max/ghaction-github-runtime@v4

      # scripts/docker-build.sh, as `mise run docker-build` runs it (the
      # version, Debian, source and revision arguments), plus: --load (the
      # docker-container builder keeps results to itself otherwise) and
      # the layer cache, one scope per architecture, mode=max so the
      # builder stage's toolchain layers are cached too. BuildKit's cache
      # mounts (cargo registry, target/) are not part of it, so a source
      # change recompiles the dependencies. A failed cache export does not
      # fail the build. The CNPG extension image comes second, from the
      # same builder's cache (no second compile), and exports nothing: the
      # full image's export already holds the builder stage. Nothing is
      # pushed.
      - name: Build the images
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          bash scripts/docker-build.sh --full -- --load \
            --cache-from "type=gha,scope=pg-automerge-${{ matrix.arch }}" \
            --cache-to "type=gha,scope=pg-automerge-${{ matrix.arch }},mode=max,ignore-error=true"
          cnpg="$(bash scripts/docker-build.sh --cnpg -- --load \
            --cache-from "type=gha,scope=pg-automerge-${{ matrix.arch }}")"
          echo "PG_AUTOMERGE_CNPG_IMAGE=$cnpg" >>"$GITHUB_ENV"
          docker image ls pg-automerge
          docker image ls pg-automerge-cnpg

      # For the cnpg-e2e job (same condition as that job): the exact CNPG
      # image this job built and tests (a few MB; `docker load` restores
      # its tag).
      - name: Save the CNPG extension image for cnpg-e2e (amd64)
        if: matrix.arch == 'amd64' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.PG_AUTOMERGE_CNPG_E2E == 'always')
        run: docker image save "$PG_AUTOMERGE_CNPG_IMAGE" | gzip >cnpg-e2e-image.tar.gz

      - name: Upload the CNPG extension image for cnpg-e2e (amd64)
        if: matrix.arch == 'amd64' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.PG_AUTOMERGE_CNPG_E2E == 'always')
        uses: actions/upload-artifact@v7
        with:
          name: cnpg-e2e-image
          path: cnpg-e2e-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Test the image (tests/docker.sh)
        env:
          PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
        run: bash tests/docker.sh

      - name: Benchmark against the image (nightly only)
        if: github.event_name == 'schedule'
        env:
          PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
        run: bash tests/docker_bench.sh | tee bench-sql-docker.txt

      - name: Upload the benchmark table (nightly only)
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-docker
          path: bench-sql-docker.txt

      # `docker load -i` reads them back; the publish job pushes them.
      - name: Save the images (tags only)
        id: archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          file="$(bash scripts/docker-archive.sh "" dist)"
          echo "file=$file" >>"$GITHUB_OUTPUT"
          echo "name=$(basename "$file" .tar.gz)" >>"$GITHUB_OUTPUT"
          cnpg="$(bash scripts/docker-archive.sh "$PG_AUTOMERGE_CNPG_IMAGE" dist)"
          echo "cnpg_file=$cnpg" >>"$GITHUB_OUTPUT"
          echo "cnpg_name=$(basename "$cnpg" .tar.gz)" >>"$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload the image (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.file }}
          # Already gzipped.
          compression-level: 0
          if-no-files-found: error

      - name: Upload the CNPG extension image (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.cnpg_name }}
          path: ${{ steps.archive.outputs.cnpg_file }}
          compression-level: 0
          if-no-files-found: error

  # tests/cnpg_e2e.sh (mise run cnpg-e2e) on the docker job's amd64 CNPG
  # extension image: a kind cluster with the CloudNativePG operator, a
  # Cluster mounting the image through spec.postgresql.extensions, the
  # extension created and updated through a Database resource, a rolling
  # update to a new extension image, removal. kind and kubectl as pinned in
  # mise.toml; the runner's Docker runs the kind node. A few minutes and a
  # kind cluster, so not on every push and pull request (tests/cnpg_smoke.sh
  # in the docker job covers the image itself there): on tags (publish
  # waits for it), nightly, on workflow_dispatch, or always with the
  # repository variable PG_AUTOMERGE_CNPG_E2E=always.
  cnpg-e2e:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.PG_AUTOMERGE_CNPG_E2E == 'always'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: aqua:kubernetes-sigs/kind kubectl
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: cnpg-e2e-image

      - name: Load the CNPG extension image
        run: |
          image="$(gunzip -c cnpg-e2e-image.tar.gz | docker image load | sed -n 's/^Loaded image: //p')"
          echo "PG_AUTOMERGE_CNPG_IMAGE=$image" >>"$GITHUB_ENV"
          rm cnpg-e2e-image.tar.gz
          sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches

      - name: End-to-end test with the CNPG operator (tests/cnpg_e2e.sh)
        run: bash tests/cnpg_e2e.sh

  # Pushes the tested images of a tag, each as one multi-architecture
  # image: the full image and the CNPG extension image.
  # Prepared, not enabled: it does nothing until the repository opts in,
  # one of two ways (docs/src/pages/operations/docker-ci.mdx, "Publishing
  # the images"):
  #   - ghcr.io with this workflow's own GITHUB_TOKEN: the repository
  #     variable PG_AUTOMERGE_PUBLISH=ghcr. The images default to
  #     ghcr.io/<owner>/pg-automerge and ghcr.io/<owner>/pg-automerge-cnpg;
  #     PG_AUTOMERGE_REGISTRY_IMAGE / _CNPG_IMAGE may name others on ghcr.io.
  #   - any registry: the secret PG_AUTOMERGE_REGISTRY_TOKEN and the
  #     variables PG_AUTOMERGE_REGISTRY_IMAGE (e.g. docker.io/you/pg-automerge)
  #     and PG_AUTOMERGE_REGISTRY_USERNAME; the CNPG image goes to
  #     PG_AUTOMERGE_REGISTRY_CNPG_IMAGE, by default <image>-cnpg.
  # packages: write is granted here only (tags only, after every test job);
  # the token is used for nothing but the ghcr.io login, and only in the
  # ghcr mode.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ci, docker, cnpg-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ vars.PG_AUTOMERGE_PUBLISH }}
      REGISTRY_IMAGE: ${{ vars.PG_AUTOMERGE_REGISTRY_IMAGE }}
      REGISTRY_CNPG_IMAGE: ${{ vars.PG_AUTOMERGE_REGISTRY_CNPG_IMAGE }}
      REGISTRY_USERNAME: ${{ vars.PG_AUTOMERGE_REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.PG_AUTOMERGE_REGISTRY_TOKEN }}
    steps:
      # Decides whether to push, where, and with which credentials; every
      # later step is gated on its push output.
      - name: Registry configured?
        id: cfg
        run: |
          case "$PUBLISH" in
            ghcr)
              owner="${GITHUB_REPOSITORY_OWNER,,}"
              image="${REGISTRY_IMAGE:-ghcr.io/$owner/pg-automerge}"
              username="$GITHUB_ACTOR"
              ;;
            "")
              if [ -z "$REGISTRY_TOKEN" ]; then
                echo "::notice::Neither PG_AUTOMERGE_PUBLISH=ghcr nor a PG_AUTOMERGE_REGISTRY_TOKEN secret: not pushing (the images are this run's artifacts)."
                echo "push=false" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              if [ -z "$REGISTRY_IMAGE" ] || [ -z "$REGISTRY_USERNAME" ]; then
                echo "::error::PG_AUTOMERGE_REGISTRY_TOKEN is set, but PG_AUTOMERGE_REGISTRY_IMAGE or PG_AUTOMERGE_REGISTRY_USERNAME is not"
                exit 1
              fi
              image="$REGISTRY_IMAGE"
              username="$REGISTRY_USERNAME"
              ;;
            *)
              echo "::error::PG_AUTOMERGE_PUBLISH is '$PUBLISH'; the only value is ghcr (or leave it unset)"
              exit 1
              ;;
          esac
          cnpg_image="${REGISTRY_CNPG_IMAGE:-$image-cnpg}"
          # One login: both images on the same registry (ghcr.io in the
          # ghcr mode, whose token is good for nothing else).
          registry="${image%%/*}"
          if [ "${cnpg_image%%/*}" != "$registry" ]; then
            echo "::error::the CNPG image ($cnpg_image) is not on the registry of the full image ($image)"
            exit 1
          fi
          if [ "$PUBLISH" = ghcr ] && [ "$registry" != ghcr.io ]; then
            echo "::error::PG_AUTOMERGE_PUBLISH=ghcr pushes to ghcr.io only, but the image is $image"
            exit 1
          fi
          echo "Pushing $image and $cnpg_image as $username"
          {
            echo "push=true"
            echo "registry=$registry"
            echo "image=$image"
            echo "cnpg_image=$cnpg_image"
            echo "username=$username"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.push == 'true'

      - uses: actions/download-artifact@v8
        if: steps.cfg.outputs.push == 'true'
        with:
          pattern: pg-automerge-*-linux-*
          path: dist
          merge-multiple: true

      - uses: docker/login-action@v4
        if: steps.cfg.outputs.push == 'true'
        with:
          registry: ${{ steps.cfg.outputs.registry }}
          username: ${{ steps.cfg.outputs.username }}
          password: ${{ env.PUBLISH == 'ghcr' && github.token || env.REGISTRY_TOKEN }}

      - name: Push
        if: steps.cfg.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}
          CNPG_IMAGE: ${{ steps.cfg.outputs.cnpg_image }}
        run: |
          bash scripts/docker-push.sh "$IMAGE" dist/pg-automerge-[0-9]*-linux-*.tar.gz
          bash scripts/docker-push.sh --cnpg "$CNPG_IMAGE" dist/pg-automerge-cnpg-*-linux-*.tar.gz
