# Four jobs on every push and pull request (three in parallel):
#   - ci: what `mise run ci` runs locally (lint, the docs site check, all
#     test suites and the regress tests, against the pgrx-managed Postgres
#     18); for a release also the package tarball.
#   - docs: only the docs site check (`mise run docs-check`), for quick
#     feedback.
#   - docker: builds the Docker images (BuildKit, layers cached in the GitHub
#     Actions cache): the full image and the CloudNativePG extension image,
#     from one builder stage, and runs tests/docker.sh against them,
#     including the container variants of the multi-session suites and
#     tests/cnpg_smoke.sh. For a release it runs on an amd64 and a native
#     arm64 runner and uploads each image as a workflow artifact.
#   - cnpg-e2e (after docker; for a release, on the nightly schedule and
#     manual runs, or on every event with the repository variable
#     PG_AUTOMERGE_CNPG_E2E=always): tests/cnpg_e2e.sh, the CNPG extension
#     image with the real CloudNativePG operator in a kind cluster.
# This workflow never publishes anything. release.yml (on a published
# GitHub release) calls it with release: true and the tag's commit, then
# pushes the images and uploads the release assets once every job here
# passed (docs/src/pages/operations/releasing.mdx).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: also run the benchmarks.
    - cron: "17 3 * * *"
  workflow_dispatch:
  # release.yml: the same jobs on a release's commit, plus what a release
  # needs (arm64, the package, the image archives, cnpg-e2e).
  workflow_call:
    inputs:
      release:
        description: "Build and test everything a release publishes, and upload it as artifacts"
        type: boolean
        default: false
      ref:
        description: "The commit to check out (the release tag's)"
        type: string
        default: ""
    outputs:
      cnpg-e2e-passed:
        description: "true once cnpg-e2e ran to its end (release.yml publishes only then)"
        value: ${{ jobs.cnpg-e2e.outputs.passed }}

# One group per event and ref: a newer push supersedes an older push run on
# the same ref, but a push to main never cancels the nightly (schedule) run
# with its benchmarks, nor the other way round. A release's call has a
# group of its own (its commit).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

# Read-only by default; no job needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # pgrx builds Postgres from source into ~/.pgrx.
  PGRX_HOME: /home/runner/.pgrx

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Postgres build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libreadline-dev zlib1g-dev flex bison libicu-dev \
            libclang-dev clang pkg-config libssl-dev libxml2-dev libxslt1-dev
          # The runner's own Postgres would take the default port; pgrx
          # uses 28818, but make sure nothing interferes.
          sudo systemctl stop postgresql || true

      # Rust (with rustfmt and clippy) and cargo-pgrx, as pinned in
      # mise.toml. mise.toml puts /usr/bin first on PATH (see its comment).
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Cache cargo registry, target and the pgrx Postgres
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.pgrx
          key: ${{ runner.os }}-pgrx0.19.3-pg18-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-pgrx0.19.3-pg18-

      - name: Initialize pgrx (builds Postgres 18 unless cached)
        run: |
          if [ ! -f "$PGRX_HOME/config.toml" ]; then mise run pgrx-init; fi

      - name: Lint, docs check, test, regress
        run: mise run ci

      - name: Benchmarks (nightly only)
        if: github.event_name == 'schedule'
        run: |
          mise run bench-core | tee bench-core.txt
          BENCH_REPS=2 mise run bench-expanded | tee bench-expanded.txt
          mise run bench-sql | tee bench-sql.txt

      - name: Upload benchmark tables
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: bench-*.txt

      # The package is built against the PGDG Postgres 18 (not pgrx's
      # development Postgres in ~/.pgrx): `cargo pgrx package` mirrors the
      # pg_config's install paths, so the tarball unpacks into
      # /usr/lib/postgresql/18/lib and /usr/share/postgresql/18/extension.
      - name: Install PGDG Postgres 18 (releases only)
        if: inputs.release
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Package (releases only)
        if: inputs.release
        run: PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config mise run package

      # Install the tarball the way docs/src/pages/guide/install.mdx says and create the
      # extension in the PGDG server.
      - name: Check the package installs (releases only)
        if: inputs.release
        run: |
          sudo tar -C / -xzf target/release/pg_automerge-pg18.tar.gz
          sudo pg_ctlcluster 18 main start || sudo pg_createcluster 18 main --start
          sudo -u postgres psql -p "$(pg_conftool -s 18 main show port)" -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION pg_automerge' \
            -c "SELECT automerge_to_jsonb(''::bytea::automerge)"

      # For release.yml's publish job, which attaches it to the release.
      - name: Upload package (releases only)
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: pg_automerge-pg18
          path: target/release/pg_automerge-pg18.tar.gz
          if-no-files-found: error
          overwrite: true

  # The documentation site (docs/): typecheck, biome, the static build
  # under /pg-automerge/ and the link/route check, as
  # `mise run docs-check` (also part of `mise run ci`). A job of its own so
  # docs feedback does not wait for pgrx; deploy-docs.yml publishes the
  # site from main.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Node and pnpm as pinned in mise.toml; nothing else.
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
          cache: true

      # mise run would otherwise install every tool in mise.toml first
      # (Rust, building cargo-pgrx from source).
      - name: Docs check
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run docs-check

  # The Docker images of docker/Dockerfile: the full image (official
  # postgres:18 + the extension built against its PGDG Postgres) and the
  # CloudNativePG extension image (the same build's files, from scratch),
  # tested with tests/docker.sh.
  # Independent of the ci job: it needs neither pgrx nor its Postgres.
  docker:
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # amd64 always; for a release also arm64, on GitHub's native arm64
        # runner (no QEMU, no cross-compilation; see
        # docs/src/pages/design/docker-image.mdx, "Docker image in CI").
        arch: ${{ fromJSON(inputs.release && '["amd64", "arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Rust as pinned in mise.toml, for the suites' fixture generators
      # (cargo run -p pg_automerge_core --example ...). Only Rust: the image
      # builds its own toolchain, and nothing here needs cargo-pgrx.
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
          cache: true

      # The client tools of the same major as the server (psql, pg_dump,
      # pg_restore, pg_regress, pg_config): PGDG's postgresql-client-18,
      # the package the image's own Postgres comes from. No server, no
      # cluster.
      - name: Install the PGDG Postgres 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/psql --version
          docker version --format 'docker {{.Server.Version}}'
          docker compose version

      # A docker-container builder (BuildKit), which can export its cache;
      # the runtime token lets `docker build` in a run step reach the
      # GitHub Actions cache (type=gha).
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - uses: crazy-max/ghaction-github-runtime@v4

      # scripts/docker-build.sh, as `mise run docker-build` runs it (the
      # version, Debian, source and revision arguments), plus: --load (the
      # docker-container builder keeps results to itself otherwise) and
      # the layer cache, one scope per architecture, mode=max so the
      # builder stage's toolchain layers are cached too. BuildKit's cache
      # mounts (cargo registry, target/) are not part of it, so a source
      # change recompiles the dependencies. A failed cache export does not
      # fail the build. The CNPG extension image comes second, from the
      # same builder's cache (no second compile), and exports nothing: the
      # full image's export already holds the builder stage. Nothing is
      # pushed.
      - name: Build the images
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          bash scripts/docker-build.sh --full -- --load \
            --cache-from "type=gha,scope=pg-automerge-${{ matrix.arch }}" \
            --cache-to "type=gha,scope=pg-automerge-${{ matrix.arch }},mode=max,ignore-error=true"
          cnpg="$(bash scripts/docker-build.sh --cnpg -- --load \
            --cache-from "type=gha,scope=pg-automerge-${{ matrix.arch }}")"
          echo "PG_AUTOMERGE_CNPG_IMAGE=$cnpg" >>"$GITHUB_ENV"
          docker image ls pg-automerge
          docker image ls pg-automerge-cnpg

      # For the cnpg-e2e job (same condition as that job): the exact CNPG
      # image this job built and tests (a few MB; `docker load` restores
      # its tag).
      - name: Save the CNPG extension image for cnpg-e2e (amd64)
        if: matrix.arch == 'amd64' && (inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.PG_AUTOMERGE_CNPG_E2E == 'always')
        run: docker image save "$PG_AUTOMERGE_CNPG_IMAGE" | gzip >cnpg-e2e-image.tar.gz

      - name: Upload the CNPG extension image for cnpg-e2e (amd64)
        if: matrix.arch == 'amd64' && (inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.PG_AUTOMERGE_CNPG_E2E == 'always')
        uses: actions/upload-artifact@v7
        with:
          name: cnpg-e2e-image
          path: cnpg-e2e-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          overwrite: true

      - name: Test the image (tests/docker.sh)
        env:
          PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
        run: bash tests/docker.sh

      - name: Benchmark against the image (nightly only)
        if: github.event_name == 'schedule'
        env:
          PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
        run: bash tests/docker_bench.sh | tee bench-sql-docker.txt

      - name: Upload the benchmark table (nightly only)
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-docker
          path: bench-sql-docker.txt

      # `docker load -i` reads them back; release.yml's publish job pushes
      # them and attaches them to the release.
      - name: Save the images (releases only)
        id: archive
        if: inputs.release
        run: |
          file="$(bash scripts/docker-archive.sh "" dist)"
          echo "file=$file" >>"$GITHUB_OUTPUT"
          echo "name=$(basename "$file" .tar.gz)" >>"$GITHUB_OUTPUT"
          cnpg="$(bash scripts/docker-archive.sh "$PG_AUTOMERGE_CNPG_IMAGE" dist)"
          echo "cnpg_file=$cnpg" >>"$GITHUB_OUTPUT"
          echo "cnpg_name=$(basename "$cnpg" .tar.gz)" >>"$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload the image (releases only)
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.file }}
          # Already gzipped.
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      - name: Upload the CNPG extension image (releases only)
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.cnpg_name }}
          path: ${{ steps.archive.outputs.cnpg_file }}
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  # tests/cnpg_e2e.sh (mise run cnpg-e2e) on the docker job's amd64 CNPG
  # extension image: a kind cluster with the CloudNativePG operator, a
  # Cluster mounting the image through spec.postgresql.extensions, the
  # extension created through a Database resource, a rolling update to a
  # rebuilt extension image of the same version, removal. kind and kubectl as pinned in
  # mise.toml; the runner's Docker runs the kind node. A few minutes and a
  # kind cluster, so not on every push and pull request (tests/cnpg_smoke.sh
  # in the docker job covers the image itself there): for a release
  # (release.yml publishes only after its last step), nightly, on
  # workflow_dispatch, or always with the repository variable
  # PG_AUTOMERGE_CNPG_E2E=always.
  cnpg-e2e:
    needs: docker
    if: inputs.release || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.PG_AUTOMERGE_CNPG_E2E == 'always'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      passed: ${{ steps.passed.outputs.passed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: jdx/mise-action@v5
        with:
          install_args: aqua:kubernetes-sigs/kind kubectl
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: cnpg-e2e-image

      - name: Load the CNPG extension image
        run: |
          image="$(gunzip -c cnpg-e2e-image.tar.gz | docker image load | sed -n 's/^Loaded image: //p')"
          echo "PG_AUTOMERGE_CNPG_IMAGE=$image" >>"$GITHUB_ENV"
          rm cnpg-e2e-image.tar.gz
          sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches

      - name: End-to-end test with the CNPG operator (tests/cnpg_e2e.sh)
        run: bash tests/cnpg_e2e.sh

      # Read by release.yml (the workflow's cnpg-e2e-passed output): a
      # skipped or failed cnpg-e2e leaves it empty, and nothing is published.
      - name: Passed
        id: passed
        run: echo "passed=true" >>"$GITHUB_OUTPUT"
