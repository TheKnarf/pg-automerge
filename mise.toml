[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# Must match the `pgrx` crate version in Cargo.toml exactly.
"cargo:cargo-pgrx" = "0.19.3"
# Workflow and shell linting for tests/check_ci.sh (mise run lint); prebuilt
# binaries. actionlint runs shellcheck on the workflow's run: scripts.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# The documentation site in docs/ (Vite + React + MDX; pnpm package).
node = "26"
pnpm = "9.15.4"

[settings]
# Build cargo tools from source with --locked for reproducibility.
cargo.binstall = false

[env]
PG_VERSION = "18"
# Linuxbrew's gcc/binutils/libstdc++ target a newer glibc than Debian 12 has;
# make sure the system toolchain wins when building Postgres and the extension.
_.path = ["/usr/bin", "/bin"]

[tasks.pgrx-init]
description = "Download and build the Postgres version pgrx develops against (~/.pgrx)"
run = "cargo pgrx init --pg{{env.PG_VERSION}} download"

[tasks.test]
description = "Run core unit tests, #[pg_test] tests in a pgrx-managed Postgres, then the multi-session scripts (concurrency, LISTEN/NOTIFY, dump/restore, upgrade, extension flags, the load memory limit against a memory-capped scratch cluster, the memory counters across statements)"
# The extension is installed once (a dev build without the pg_test
# instrumentation) for all multi-session scripts.
run = [
  "cargo test -p pg_automerge_core",
  "cargo pgrx test pg{{env.PG_VERSION}}",
  "bash -c 'source tests/lib.sh && install_extension'",
  "PG_AUTOMERGE_INSTALLED=1 bash tests/concurrency.sh",
  "PG_AUTOMERGE_INSTALLED=1 bash tests/notify.sh",
  "PG_AUTOMERGE_INSTALLED=1 bash tests/dump.sh",
  "PG_AUTOMERGE_INSTALLED=1 bash tests/upgrade.sh",
  "PG_AUTOMERGE_INSTALLED=1 bash tests/extension.sh",
  "PG_AUTOMERGE_INSTALLED=1 bash tests/limits.sh",
  "PG_AUTOMERGE_INSTALLED=1 bash tests/memory.sh",
]

[tasks.regress]
description = "Check the regress fixtures against their generator, then run pg_regress tests in tests/pg_regress"
# --resetdb: recreate the regress database so setup.sql installs the
# current extension SQL (a reused database keeps the old objects).
run = [
  "bash tests/check_regress_fixtures.sh",
  "cargo pgrx regress pg{{env.PG_VERSION}} --resetdb",
]

[tasks.run]
description = "Install the extension and open psql against a pgrx-managed Postgres"
run = "cargo pgrx run pg{{env.PG_VERSION}}"

[tasks.notify]
description = "A real LISTEN session receiving automerge_notify() notifications (installs + starts the pgrx Postgres)"
run = "bash tests/notify.sh"

[tasks.concurrency]
description = "Two concurrent psql sessions merging into one row (installs + starts the pgrx Postgres)"
run = "bash tests/concurrency.sh"

[tasks.dump]
description = "pg_dump/pg_restore (plain and custom format) and COPY round trips of every object kind (installs + starts the pgrx Postgres)"
run = "bash tests/dump.sh"

[tasks.upgrade]
description = "Install every released version's snapshot, ALTER EXTENSION UPDATE, compare the catalog with a fresh install (installs + starts the pgrx Postgres)"
run = "bash tests/upgrade.sh"

[tasks.extension]
description = "Control-file flags: CREATE EXTENSION .. SCHEMA, ALTER EXTENSION SET SCHEMA with dependent objects, dump/restore of a moved extension, no install by non-superusers, verify_writes and max_load_memory stay superuser-only (installs + starts the pgrx Postgres)"
run = "bash tests/extension.sh"

[tasks.limits]
description = "The load memory limit against real crashes: a scratch cluster with its address space capped aborts on crafted and compressed input without the limit, and gets clean 53400 errors with it (installs the extension; part of test)"
run = "bash tests/limits.sh"

[tasks.memory]
description = "automerge_memory_usage() across many statements, transactions and errors in one session (no leaked bytes or documents), its reset, and per-backend counters (installs + starts the pgrx Postgres)"
run = "bash tests/memory.sh"

[tasks.replication]
description = "Logical replication (text and binary) between two databases of a scratch cluster; not part of test"
run = "bash tests/replication.sh"

[tasks.fuzz]
description = "Long mutation-fuzzing session of the core entry points (release build); FUZZ_ITERS, FUZZ_SEED, FUZZ_SAVE_DIR"
run = "FUZZ_ITERS=${FUZZ_ITERS:-200000} cargo test --release -p pg_automerge_core --test fuzz -- --nocapture"

[tasks.bench-expanded]
description = "Benchmark SQL workloads (writes, jsonb reads, merges, PL/pgSQL loops, merge_agg) on a release build; not part of test"
run = "bash tests/bench_expanded.sh"

[tasks.bench-core]
description = "Rust-level timings of load, normalize, save and the JSON walk on the benchmark documents (release build); not part of test"
run = "cargo run --release -q -p pg_automerge_core --example bench_core"

[tasks.bench-alloc]
description = "Overhead of the counting global allocator (src/alloc.rs) over the system allocator, per allocation (release build; pin it with taskset for stable numbers); not part of test"
run = "cargo run --release -q -p pg_automerge_core --example bench_alloc"

[tasks.package]
description = "Build a release package for the Postgres 18 of $PG_CONFIG (required; not pgrx's own) into target/release/pg_automerge-pg18/ and a tarball of it"
run = "bash scripts/package.sh"

[tasks.lint]
description = "CI/packaging checks (actionlint, shellcheck, workflow and Docker invariants), rustfmt check, clippy -D warnings for each build configuration, rustdoc -D warnings"
run = [
  "bash tests/check_ci.sh",
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo clippy --workspace --all-targets --features 'pg18 pg_test' --no-default-features -- -D warnings",
  "cargo clippy -p pg_automerge_core --all-targets -- -D warnings",
  "RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --workspace --document-private-items",
]

[tasks.ci]
description = "Everything CI runs: lint, docs-check, test (all suites), regress"
run = [
  "mise run lint",
  "mise run docs-check",
  "mise run test",
  "mise run regress",
]

[tasks.bench-sql]
description = "Median timings of the everyday SQL paths (reads, inserts, merges, upserts) on a release build; not part of test"
run = "bash tests/bench_sql.sh"

[tasks.docker-build]
description = "Build the Docker image (official postgres:18 + pg_automerge, built against its PGDG Postgres) as pg-automerge:<version> and pg-automerge:dev; extra docker build args after --"
run = "bash scripts/docker-build.sh"

[tasks.docker-test]
description = "Build the Docker image, then test it: init, SQL (casts, merge, jsonb + GIN index, history, LISTEN/NOTIFY), settings, dump/restore into a second container, restart on a volume, PG_AUTOMERGE_CREATE_EXTENSION, the regress examples and the concurrency/notify/dump/extension/memory suites against a container, limits.sh against a memory-capped one, a 60-second soak.sh smoke run, server logs, compose.yaml; not part of test"
depends = ["docker-build"]
run = "bash tests/docker.sh"

[tasks.soak]
description = "Soak test: a long concurrent pgbench load (writes with merge, upserts of full saves, concurrent writers on one row, jsonb/GIN/generated column reads, automerge_spans, history, merge_agg, a LISTEN client, VACUUM) against the Docker image in a memory-capped container, sampling RSS, automerge_memory_usage(), memory contexts, table/TOAST sizes and bloat, WAL and latency; report and checks in target/soak/<time>/ (SOAK_DURATION, default 60m; SOAK_CLIENTS, default 8; SOAK_DOC_SIZE in kB, default 1000; see tests/soak.sh); not part of test"
depends = ["docker-build"]
run = "bash tests/soak.sh"

[tasks.docker-upgrade-test]
description = "Upgrade a 0.1.0 (or, with PG_AUTOMERGE_OLD_VERSION=0.2.0, a 0.2.0) deployment to the current image: an old container (PG_AUTOMERGE_OLD_IMAGE, or built from the release revision) with tables, a generated doc::jsonb column, indexes, a notify trigger and data; the new image on the same volume, following the README compose steps (a non-postgres superuser, the README's pg_dump and psql commands, a service build: with the version arg); ALTER EXTENSION pg_automerge UPDATE; data, indexes, trigger, automerge_spans and the catalog checked; not part of test or docker-test"
depends = ["docker-build"]
run = "bash tests/docker_upgrade.sh"

[tasks.docker-bench-sql]
description = "bench-sql against the Docker image (release build on the PGDG Postgres 18, no assertions) in a throwaway container; not part of test"
depends = ["docker-build"]
run = "bash tests/docker_bench.sh"

[tasks.docker-up]
description = "Start the compose.yaml development Postgres (builds the image first) on 127.0.0.1:${PG_AUTOMERGE_PORT:-5432} and wait until it is healthy"
depends = ["docker-build"]
run = "docker compose up -d --wait"

[tasks.docker-down]
description = "Stop the compose.yaml development Postgres (keeps the data volume; docker compose down -v removes it)"
run = "docker compose down"

# The documentation site (docs/, a standalone pnpm package; docs/Readme.md).
[tasks.docs-install]
description = "Install the docs site's dependencies (pnpm, from docs/pnpm-lock.yaml)"
dir = "{{config_root}}/docs"
run = "pnpm install --frozen-lockfile --prefer-offline"

[tasks.docs-dev]
description = "Docs site dev server with hot reload (Vite)"
depends = ["docs-install"]
dir = "{{config_root}}/docs"
run = "pnpm dev"

[tasks.docs-build]
description = "Build the static docs site into docs/dist (DOCS_BASE: the path it is served under, default /)"
depends = ["docs-install"]
dir = "{{config_root}}/docs"
run = "pnpm build"

[tasks.docs-check]
description = "Docs site: typecheck, biome, the static build under /pg-automerge/ (or DOCS_BASE), and check-site (every page emitted, every internal link and anchor resolves)"
depends = ["docs-install"]
dir = "{{config_root}}/docs"
run = "DOCS_BASE=\"${DOCS_BASE:-/pg-automerge/}\" pnpm check"
