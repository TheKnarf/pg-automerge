[package]
name = "pg_automerge_core"
version = "0.0.0"
edition = "2024"
description = "Postgres-independent Automerge logic for the pg_automerge extension"

[dependencies]
automerge.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Recomputes chunk checksums in the structure-aware fuzz test
# (already in the lock file through automerge).
sha2 = "0.11"
