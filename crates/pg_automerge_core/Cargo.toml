[package]
name = "pg_automerge_core"
version = "0.0.0"
edition = "2024"
description = "Postgres-independent Automerge logic for the pg_automerge extension"

[features]
# Instrumentation for the extension's tests: loaded::live_count().
test-hooks = []

[dependencies]
automerge.workspace = true
serde_json.workspace = true
# Change hashes of bare change chunks (header::change_chunks); the same
# version automerge uses, already in the lock file through it.
sha2 = "0.11"
