[workspace]
members = [".", "crates/pg_automerge_core"]

[workspace.dependencies]
automerge = "=0.12.0"
serde_json = "1"

[package]
name = "pg_automerge"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Automerge CRDT documents as a native Postgres type: jsonb queries, merges, history and change notifications"
readme = "README.md"
keywords = ["postgres", "automerge", "crdt", "pgrx", "jsonb"]
categories = ["database"]
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = ["pg_automerge_core/test-hooks"]

[dependencies]
pgrx = "=0.19.3"
pg_automerge_core = { path = "crates/pg_automerge_core" }

[dev-dependencies]
pgrx-tests = "=0.19.3"
# `cargo test` builds the pg_tests too (cfg(test)); they use its hooks.
pg_automerge_core = { path = "crates/pg_automerge_core", features = ["test-hooks"] }

# panic = "unwind" is mandatory in every profile: pgrx turns Rust panics
# into Postgres ERRORs by unwinding to its FFI boundary, and the core's
# guard() catches Automerge's decoder panics with catch_unwind to report
# corrupt input as 22P02. With panic = "abort" any panic would kill the
# backend (and with it the whole server's shared state: a crash restart).
[profile.dev]
panic = "unwind"

# Dependencies are optimized even in dev builds (what `cargo pgrx test` and
# `cargo pgrx install` use): Automerge is very slow unoptimized, which made
# the multi-megabyte test documents take minutes.
[profile.dev.package."*"]
opt-level = 3

# Make Automerge behave in dev builds as it does in release, so tests
# exercise what ships:
# - It sums counter values with plain `+`. Release builds wrap on i64
#   overflow, but with overflow checks a document whose counter exceeds
#   i64::MAX panicked on read (ERROR in Postgres) only in dev builds.
# - Its debug assertions include O(n) "_slow" cross-checks per op, which made
#   building/loading large documents quadratic.
[profile.dev.package.automerge]
overflow-checks = false
debug-assertions = false

[profile.release]
panic = "unwind" # mandatory, see [profile.dev]
opt-level = 3
lto = "fat"
codegen-units = 1
# No DWARF debug info in the shipped library (also Cargo's default when
# `debug` is off; explicit so that turning on `debug` for profiling does not
# silently ship it), but keep the symbol table ("symbols" would drop it) so
# backtraces and perf profiles of a production backend stay readable.
strip = "debuginfo"
