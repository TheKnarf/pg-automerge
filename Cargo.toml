[workspace]
members = [".", "crates/pg_automerge_core"]

[workspace.dependencies]
automerge = "=0.12.0"
serde_json = "1"

[package]
name = "pg_automerge"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "=0.19.3"
pg_automerge_core = { path = "crates/pg_automerge_core" }
automerge.workspace = true
serde_json.workspace = true

[dependencies.pgrx-bench]
version = "=0.19.3"
optional = true

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
